name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Bump the version, commit it and publish a GitHub release.
          On dev this makes a x.y.z-dev.N pre-release.
          On main a -dev version only drops the -dev suffix.
        type: choice
        default: "Build only (no release)"
        options:
          - "Build only (no release)"
          - "Release patch update (x.x.N)"
          - "Release minor update (x.N.x)"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Release build"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Bump version"
        id: bump
        if: inputs.release != 'Build only (no release)'
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$RELEASE_TYPE" in
            "Release patch update"*) BUMP=patch ;;
            "Release minor update"*) BUMP=minor ;;
            *) echo "::error::Unknown release type: $RELEASE_TYPE"; exit 1 ;;
          esac

          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "dev" ]; then
            echo "::error::Releases can only be made from main or dev, not '$BRANCH'"
            exit 1
          fi

          OLD_CODE=$(sed -nE 's/^def ourGmsVersionCode = ([0-9]+)$/\1/p' build.gradle)
          OLD_NAME=$(sed -nE 's/^def ourGmsVersionName = "([^"]+)"$/\1/p' build.gradle)
          if [ -z "$OLD_CODE" ] || [ -z "$OLD_NAME" ]; then
            echo "::error::Could not find ourGmsVersionCode / ourGmsVersionName in build.gradle"
            exit 1
          fi

          if [[ ! "$OLD_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-dev\.([0-9]+))?$ ]]; then
            echo "::error::Unsupported version name format: $OLD_NAME"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          DEV=${BASH_REMATCH[5]}

          if [ "$BRANCH" = "main" ]; then
            PRERELEASE=false
            if [ -n "$DEV" ]; then
              # dev was merged to main, release the version dev was working towards.
              echo "::notice::Dropping -dev suffix from $OLD_NAME, the $BUMP selection is not used"
              NEW_NAME="$MAJOR.$MINOR.$PATCH"
            elif [ "$BUMP" = "minor" ]; then
              NEW_NAME="$MAJOR.$((MINOR + 1)).0"
            else
              NEW_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          else
            PRERELEASE=true
            if [ -z "$DEV" ]; then
              # Last version was a stable release, start a new dev series.
              if [ "$BUMP" = "minor" ]; then
                NEW_NAME="$MAJOR.$((MINOR + 1)).0-dev.1"
              else
                NEW_NAME="$MAJOR.$MINOR.$((PATCH + 1))-dev.1"
              fi
            elif [ "$BUMP" = "minor" ] && [ "$PATCH" != "0" ]; then
              # Current dev series is a patch update, move it to the next minor.
              NEW_NAME="$MAJOR.$((MINOR + 1)).0-dev.1"
            else
              NEW_NAME="$MAJOR.$MINOR.$PATCH-dev.$((DEV + 1))"
            fi
          fi
          NEW_CODE=$((OLD_CODE + 1))

          if git rev-parse -q --verify "refs/tags/$NEW_NAME" > /dev/null; then
            echo "::error::Tag $NEW_NAME already exists"
            exit 1
          fi

          sed -i -E \
            -e "s/^def ourGmsVersionCode = [0-9]+$/def ourGmsVersionCode = $NEW_CODE/" \
            -e "s/^def ourGmsVersionName = \"[^\"]+\"$/def ourGmsVersionName = \"$NEW_NAME\"/" \
            build.gradle
          grep -qx "def ourGmsVersionCode = $NEW_CODE" build.gradle
          grep -qx "def ourGmsVersionName = \"$NEW_NAME\"" build.gradle

          echo "Version: $OLD_NAME ($OLD_CODE) -> $NEW_NAME ($NEW_CODE)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Update build version" -- build.gradle

          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: "Build universal icon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease"

      - name: "Sign universal icon APK"
        id: sign_universal
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Compute version"
        id: version
        run: |
          APK="${{ steps.sign_universal.outputs.signedFile }}"
          VER=$("$ANDROID_HOME"/build-tools/35.0.0/aapt dump badging "$APK" | grep -oP "versionName='\K[^']+")
          SAFE=$(echo "$VER" | sed -E 's/ \(.*\)//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      - name: "Prepare universal icon APK"
        run: |
          mkdir -p dist
          cp "${{ steps.sign_universal.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}.apk"

      - name: "Build ARM64 icon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -Pabi=arm64-v8a"

      - name: "Sign ARM64 icon APK"
        id: sign_arm64
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Prepare ARM64 icon APK"
        run: |
          cp "${{ steps.sign_arm64.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}-icon-arm64-v8a.apk"

      - name: "Build ARMv7 icon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -Pabi=armeabi-v7a"

      - name: "Sign ARMv7 icon APK"
        id: sign_armv7
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Prepare ARMv7 icon APK"
        run: |
          cp "${{ steps.sign_armv7.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}-icon-armeabi-v7a.apk"

      - name: "Build universal noicon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -PnoIcon=true"

      - name: "Sign universal noicon APK"
        id: sign_noicon_universal
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Prepare universal noicon APK"
        run: |
          cp "${{ steps.sign_noicon_universal.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}-noicon.apk"

      - name: "Build ARM64 noicon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -PnoIcon=true -Pabi=arm64-v8a"

      - name: "Sign ARM64 noicon APK"
        id: sign_noicon_arm64
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Prepare ARM64 noicon APK"
        run: |
          cp "${{ steps.sign_noicon_arm64.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}-noicon-arm64-v8a.apk"

      - name: "Build ARMv7 noicon APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -PnoIcon=true -Pabi=armeabi-v7a"

      - name: "Sign ARMv7 noicon APK"
        id: sign_noicon_armv7
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: "Prepare ARMv7 noicon APK"
        run: |
          cp "${{ steps.sign_noicon_armv7.outputs.signedFile }}" "dist/microg-${{ steps.version.outputs.tag }}-noicon-armeabi-v7a.apk"

      - name: "List APKs"
        run: ls -lh dist/

      - name: "Push version bump and create release"
        if: steps.bump.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.name }}
          APK_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$APK_TAG" != "$TAG" ]; then
            echo "::error::APK version '$APK_TAG' does not match bumped version '$TAG'"
            exit 1
          fi

          # Release notes start from the last release of any kind for dev,
          # and from the last stable release for main.
          if [ "$PRERELEASE" = "true" ]; then
            PREV=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
            FLAGS=(--prerelease --latest=false)
          else
            PREV=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
            FLAGS=(--latest)
          fi
          if [ -n "$PREV" ]; then
            FLAGS+=(--notes-start-tag "$PREV")
          fi

          # Fails if the branch moved while building, nothing is released in that case.
          git push origin "HEAD:refs/heads/$BRANCH"

          gh release create "$TAG" dist/*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes \
            "${FLAGS[@]}"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the back merge manually.
      - name: "Back merge main to dev"
        if: steps.bump.outputs.name != '' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run back_merge.yml --ref main

      - name: "Upload APK (universal icon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}.apk

      - name: "Upload APK (ARM64 icon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-arm64-v8a
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}-icon-arm64-v8a.apk

      - name: "Upload APK (ARMv7 icon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-armeabi-v7a
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}-icon-armeabi-v7a.apk

      - name: "Upload APK (universal noicon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-noicon
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}-noicon.apk

      - name: "Upload APK (ARM64 noicon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-noicon-arm64-v8a
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}-noicon-arm64-v8a.apk

      - name: "Upload APK (ARMv7 noicon)"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-noicon-armeabi-v7a
          if-no-files-found: error
          archive: false
          path: dist/microg-${{ steps.version.outputs.tag }}-noicon-armeabi-v7a.apk