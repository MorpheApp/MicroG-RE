name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: "Gradle build & GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "18"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done

      - name: "Execute Gradle build"
        run: "./gradlew --no-daemon clean :play-services-core:assembleDefaultRelease"

      - name: "Zipalign & Sign APK with Android SDK apksigner (v1, v2, v3 schemes)"
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Locate unsigned APK
          RAW_APK=$(find play-services-core/build/outputs/apk/default/release -name "*.apk" | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          # 2. Decode keystore from base64
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # 3. Get Android SDK build-tools path
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS"

          # 4. Zipalign APK for 4-byte alignment
          $BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" microg-aligned.apk

          # 5. Sign APK with apksigner (v1 + v2 + v3 schemes)
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out microg-RE-release-signed.apk \
            microg-aligned.apk

          # 6. Verify signature
          echo "Verifying APK signature scheme..."
          $BUILD_TOOLS/apksigner verify --verbose microg-RE-release-signed.apk

          # 7. Output signed file path
          echo "signedFile=microg-RE-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE
          archive: false
          path: ${{ steps.sign_app.outputs.signedFile }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.sign_app.outputs.signedFile }}
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

