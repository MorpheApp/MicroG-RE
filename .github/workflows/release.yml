name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: "Gradle build & GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "18"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done

      - name: "Execute Gradle build"
        run: "./gradlew --no-daemon clean :play-services-core:assembleDefaultRelease"

      - name: "Generate fallback keystore if secrets are missing"
        if: ${{ secrets.KEYSTORE_B64 == '' && secrets.KEYSTORE_BASE64 == '' && secrets.SIGNING_KEY == '' && secrets.ANDROID_SIGNING_KEY == '' }}
        run: |
          keytool -genkey -v -keystore fallback.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=MicroG,C=US"
          echo "FALLBACK_KEYSTORE_B64=$(base64 -w 0 fallback.keystore)" >> $GITHUB_ENV
          echo "FALLBACK_ALIAS=androiddebugkey" >> $GITHUB_ENV
          echo "FALLBACK_PASS=android" >> $GITHUB_ENV

      - uses: ilharp/sign-android-release@v2
        name: "Sign app APK"
        id: sign_app
        with:
          releaseDir: play-services-core/build/outputs/apk/default/release
          signingKey: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY || secrets.ANDROID_SIGNING_KEY || env.FALLBACK_KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEY_ALIAS || secrets.ALIAS || secrets.KEY_STORE_ALIAS || env.FALLBACK_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || env.FALLBACK_PASS }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || env.FALLBACK_PASS }}
          buildToolsVersion: 36.0.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE
          archive: false
          path: ${{ steps.sign_app.outputs.signedFile }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedFile }}
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

